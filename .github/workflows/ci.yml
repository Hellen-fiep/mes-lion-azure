# =====================================================================
# MES LION — Integração contínua (GitHub Actions)
#  - Linux: testes de unidade, API, banco SQL Server 2022 real, navegador (Playwright),
#           A/B de telas contra o contrato do servidor original e migração do PostgreSQL 16.
#  - Windows: executável autocontido win-x64 (não exige .NET instalado) + testes com
#             modo Portátil e SQL Server LocalDB.
#  - Publica os pacotes no release "build-mais-recente".
# =====================================================================
name: CI MES LION Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SA_PASSWORD: "MesLion#Teste2026"

jobs:
  linux:
    name: Linux — SQL Server 2022 + PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MesLion#Teste2026"
          MSSQL_PID: Developer
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'MesLion#Teste2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste
        run: |
          pip install requests pymssql playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq postgresql-client >/dev/null
          pwsh --version && psql --version

      - name: Testes de unidade
        run: |
          mkdir -p out
          dotnet run -c Release --project tests/MesLion.Testes 2>&1 | tee out/testes_unidade.log

      - name: Publicar (Linux x64 — este mesmo pacote, testado abaixo, é o do Azure App Service)
        run: |
          dotnet publish src/MesLion.Server -c Release -r linux-x64 --self-contained false -o out/app
          (cd out/app && zip -qr ../MES_LION_AZURE_app-service.zip .)
          ls -la out/MES_LION_AZURE_app-service.zip

      - name: Iniciar MES com SQL Server
        run: |
          mkdir -p out/Dados
          cp tests/dados_teste/MES_LION_DATA_TESTE.json out/Dados/MES_LION_DATA.json
          cd out/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionCI;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Relacional__AtrasoSegundos=2
          nohup ./MesLion.Server --urls http://0.0.0.0:8765 > ../server_sql.log 2>&1 &   # 0.0.0.0: também testa o acesso remoto (rede)
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 1; done
          echo; curl -sf http://127.0.0.1:8765/healthz | tee ../healthz_sql.json || { tail -n 200 ../server_sql.log; exit 1; }

      - name: Testes de API (SQL Server)
        run: python tests/testes_api.py http://127.0.0.1:8765 out/Dados/MES_LION_DATA.json 2>&1 | tee out/testes_api_sql.log

      - name: Verificação do banco SQL Server (esquema, camada relacional, views, FKs)
        run: python tests/verificar_sqlserver.py localhost 1433 sa "$SA_PASSWORD" MesLionCI http://127.0.0.1:8765 2>&1 | tee out/verificar_sqlserver.log

      - name: Testes ponta a ponta no navegador (SQL Server)
        run: |
          IP=$(hostname -I | awk '{print $1}')
          echo "Acesso remoto (rede) via http://$IP:8765"
          python tests/e2e_fluxos.py http://127.0.0.1:8765 "http://$IP:8765" 2>&1 | tee out/e2e_sql.log

      - name: A/B de telas — servidor original (contrato PowerShell) x servidor novo (SQL Server)
        run: |
          mkdir -p out/frontend_original
          cp -r src/MesLion.Server/wwwroot/* out/frontend_original/
          cp tests/referencia_frontend_original/index.html out/frontend_original/index.html
          rm out/frontend_original/js/mes_plataforma_azure.js   # adaptador de plataforma (inclui a correção de ACV/LCC)
          nohup python tests/servidor_referencia_contrato_ps.py --root out/frontend_original --seed out/Dados/MES_LION_DATA.json --port 8766 > out/ref.log 2>&1 &
          # referência das telas corrigidas (ACV/LCC): frontend original + estado com as coleções do módulo inicializadas
          python tests/seed_com_colecoes.py out/Dados/MES_LION_DATA.json out/seed_com_colecoes.json
          nohup python tests/servidor_referencia_contrato_ps.py --root out/frontend_original --seed out/seed_com_colecoes.json --port 8768 > out/ref_colecoes.log 2>&1 &
          cd out/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionAB;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Arquivos__PastaLocal=../DadosAB/Arquivos
          nohup ./MesLion.Server --urls http://127.0.0.1:8767 > ../server_ab.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8767/healthz && curl -s http://127.0.0.1:8766/ > /dev/null && curl -s http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          cd ../..
          python tests/ab_comparar_telas.py http://127.0.0.1:8766 http://127.0.0.1:8767 out/ab_resultado.json http://127.0.0.1:8768 2>&1 | tee out/ab_telas.log

      - name: Primeira tela após o login — todas as opções do menu, sem erro JavaScript (SQL Server)
        run: |
          cd out/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionPT;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Arquivos__PastaLocal=../DadosPT/Arquivos
          nohup ./MesLion.Server --urls http://127.0.0.1:8769 > ../server_pt.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8769/healthz && break; sleep 1; done
          cd ../..
          python tests/primeira_tela.py http://127.0.0.1:8769 2>&1 | tee out/primeira_tela.log

      - name: Migração PostgreSQL → SQL Server (script de exportação + importação)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python tests/teste_migracao.py out/app tests/dados_teste/MES_LION_DATA_TESTE.json "Server=localhost,1433;Database=MesLionMig;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true" 2>&1 | tee out/migracao.log

      - name: Logs do servidor
        if: always()
        run: |
          tail -n 80 out/server_sql.log || true
          tail -n 40 out/server_ab.log || true

      - name: Diagnóstico — publicar logs no release "ci-diagnostico"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diag
          cp out/*.log out/*.json diag/ 2>/dev/null || true
          find out -maxdepth 3 -name "*.log" -path "*Dados*" -exec cp {} diag/ \; 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > diag/execucao.txt
          (cd diag && zip -qr ../diagnostico-linux.zip .)
          gh release create ci-diagnostico --repo "$GITHUB_REPOSITORY" --title "Diagnóstico do CI" --notes "Logs da última execução do CI (não é um pacote para uso)." --prerelease --target "$GITHUB_SHA" 2>/dev/null || true
          for t in 1 2 3; do gh release upload ci-diagnostico diagnostico-linux.zip --repo "$GITHUB_REPOSITORY" --clobber && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-linux
          path: |
            out/*.log
            out/ab_resultado.json
            out/MES_LION_AZURE_app-service.zip

  windows:
    name: Windows — executável win-x64 + LocalDB
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"   # saída dos testes em UTF-8 (acentos corretos nos logs)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar executável autocontido e enxuto (não exige .NET instalado)
        run: >
          dotnet publish src/MesLion.Server -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:GenerateDocumentationFile=false
          -p:PublishTrimmed=true -p:TrimMode=partial
          -o out/win-x64/app

      - name: Tamanho do executável
        shell: pwsh
        run: |
          Get-ChildItem out/win-x64/app -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize | Out-String | Tee-Object -FilePath out/tamanho_executavel.log

      - name: Frontend publicado idêntico ao original (byte a byte, MANIFESTO_FRONTEND.txt)
        shell: pwsh
        run: |
          function Hashes($raiz) {
            $r = (Resolve-Path $raiz).Path
            Get-ChildItem $raiz -Recurse -File | ForEach-Object {
              [pscustomobject]@{ p = $_.FullName.Substring($r.Length).Replace('\', '/'); h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } }
          }
          $repo = @(Hashes 'src/MesLion.Server/wwwroot'); $pub = @(Hashes 'out/win-x64/app/wwwroot')
          $dif = Compare-Object $repo $pub -Property p, h
          if ($dif) { $dif | Format-Table -AutoSize | Out-String | Write-Host; throw 'O frontend publicado difere do repositório.' }
          $man = Get-Content MANIFESTO_FRONTEND.txt -Raw
          $fora = @($pub | Where-Object { $man -notmatch $_.h })
          if ($fora) { $fora | Format-Table | Out-String | Write-Host; throw 'Arquivos do frontend fora do MANIFESTO_FRONTEND.txt.' }
          "Frontend publicado: $($pub.Count) arquivos idênticos ao repositório e ao MANIFESTO_FRONTEND.txt" | Tee-Object -FilePath out/frontend_identico.log

      - name: Teste rápido — modo Portátil
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          pip install requests | Out-Null
          New-Item -ItemType Directory out/win-x64/Dados -Force | Out-Null
          Copy-Item tests/dados_teste/MES_LION_DATA_TESTE.json out/win-x64/Dados/MES_LION_DATA.json
          $env:MesLion__Banco__Provedor = 'Portatil'
          $p = Start-Process -FilePath "$PWD/out/win-x64/app/MesLion.Server.exe" -ArgumentList '--urls','http://127.0.0.1:8765' -WorkingDirectory "$PWD/out/win-x64/app" -PassThru -RedirectStandardOutput out/win_portatil.log -RedirectStandardError out/win_portatil_err.log
          for ($i = 0; $i -lt 120; $i++) { try { Invoke-RestMethod http://127.0.0.1:8765/healthz | Out-Null; break } catch { Start-Sleep 1 } }
          python tests/testes_api.py http://127.0.0.1:8765 out/win-x64/Dados/MES_LION_DATA.json 2>&1 | Tee-Object -FilePath out/testes_api_win_portatil.log
          $codigo = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          Remove-Item out/win-x64/Dados/BancoPortatil, out/win-x64/Dados/Arquivos -Recurse -Force -ErrorAction SilentlyContinue
          exit $codigo

      - name: Importação de pacote de migração com o executável (sem PostgreSQL)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          pip install requests bcrypt | Out-Null
          python tests/teste_importacao_pacote.py out/win-x64/app tests/dados_teste/MES_LION_DATA_TESTE.json 2>&1 | Tee-Object -FilePath out/importacao_win.log
          exit $LASTEXITCODE

      - name: Navegador (E2E) com o executável Windows — modo Portátil
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          pip install requests playwright | Out-Null
          python -m playwright install chromium | Out-Null
          $d = Join-Path $env:RUNNER_TEMP 'mes_e2e'
          New-Item -ItemType Directory $d -Force | Out-Null
          $env:MesLion__Banco__Provedor = 'Portatil'
          $env:MesLion__Banco__PastaPortatil = Join-Path $d 'BancoPortatil'
          $env:MesLion__Arquivos__PastaLocal = Join-Path $d 'Arquivos'
          $env:MesLion__Seed__ArquivoInicial = (Resolve-Path tests/dados_teste/MES_LION_DATA_TESTE.json).Path
          $p = Start-Process -FilePath "$PWD/out/win-x64/app/MesLion.Server.exe" -ArgumentList '--urls','http://127.0.0.1:8770' -WorkingDirectory "$PWD/out/win-x64/app" -PassThru -RedirectStandardOutput out/win_e2e.log -RedirectStandardError out/win_e2e_err.log
          for ($i = 0; $i -lt 120; $i++) { try { Invoke-RestMethod http://127.0.0.1:8770/healthz | Out-Null; break } catch { Start-Sleep 1 } }
          python tests/e2e_fluxos.py http://127.0.0.1:8770 2>&1 | Tee-Object -FilePath out/e2e_win.log
          $codigo = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          exit $codigo

      - name: Teste com SQL Server LocalDB (detecção automática)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb -y --no-progress | Out-Null
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          }
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB
          Remove-Item Env:MesLion__Banco__Provedor -ErrorAction SilentlyContinue
          $env:MesLion__Banco__NomeBancoLocalDb = 'MesLionCI'
          $env:MesLion__Arquivos__PastaLocal = '../Dados/ArquivosLocalDb'
          $p = Start-Process -FilePath "$PWD/out/win-x64/app/MesLion.Server.exe" -ArgumentList '--urls','http://127.0.0.1:8765' -WorkingDirectory "$PWD/out/win-x64/app" -PassThru -RedirectStandardOutput out/win_localdb.log -RedirectStandardError out/win_localdb_err.log
          for ($i = 0; $i -lt 180; $i++) { try { Invoke-RestMethod http://127.0.0.1:8765/healthz | Out-Null; break } catch { Start-Sleep 1 } }
          $info = Invoke-RestMethod http://127.0.0.1:8765/healthz
          Write-Host "Provedor: $($info.banco)"
          if ($info.banco -ne 'SqlServer') { Get-Content out/win_localdb.log; throw 'LocalDB não foi detectado/usado.' }
          python tests/testes_api.py http://127.0.0.1:8765 out/win-x64/Dados/MES_LION_DATA.json 2>&1 | Tee-Object -FilePath out/testes_api_win_localdb.log
          $codigo = $LASTEXITCODE
          # camada relacional (views rel.* e tabelas normalizadas) gerada pelo executável no LocalDB
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-RestMethod http://127.0.0.1:8765/api/auth/login -Method Post -ContentType 'application/json' -Body '{"username":"admin","password":"meslion2026"}' -WebSession $s | Out-Null
          for ($i = 0; $i -lt 40; $i++) { $rel = (Invoke-RestMethod http://127.0.0.1:8765/api/info -WebSession $s).camadaRelacional; if ($null -ne $rel.sucesso) { break }; Start-Sleep 2 }
          "Camada relacional (LocalDB): sucesso=$($rel.sucesso) | $($rel.mensagem)" | Tee-Object -FilePath out/relacional_localdb.log
          if ($rel.sucesso -ne $true -and $codigo -eq 0) { $codigo = 1 }
          Stop-Process -Id $p.Id -Force
          Get-Content out/win_localdb.log -Tail 30
          Remove-Item out/win-x64/Dados/ArquivosLocalDb -Recurse -Force -ErrorAction SilentlyContinue
          exit $codigo

      - name: Empacotar executável
        shell: pwsh
        run: |
          Remove-Item out/win-x64/Dados -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path out/win-x64/app/* -DestinationPath out/MES_LION_AZURE_win-x64_app.zip -Force
          Get-ChildItem out/win-x64/app | Select-Object Name, Length | Format-Table -AutoSize

      - name: Diagnóstico — publicar logs no release "ci-diagnostico"
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory diag -Force | Out-Null
          Copy-Item out/*.log diag/ -ErrorAction SilentlyContinue
          Get-ChildItem out/win-x64/app -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-File diag/arquivos_app.txt
          "${{ github.sha }} ${{ job.status }}" | Out-File diag/execucao.txt
          Compress-Archive -Path diag/* -DestinationPath diagnostico-windows.zip -Force
          gh release create ci-diagnostico --repo "$env:GITHUB_REPOSITORY" --title "Diagnóstico do CI" --notes "Logs da última execução do CI (não é um pacote para uso)." --prerelease --target "$env:GITHUB_SHA" 2>$null
          for ($t = 1; $t -le 3; $t++) { gh release upload ci-diagnostico diagnostico-windows.zip --repo "$env:GITHUB_REPOSITORY" --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5 }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-windows
          path: |
            out/*.log
            out/MES_LION_AZURE_win-x64_app.zip

  # -------------------------------------------------------------------------------------------------
  # Fase 1 (padrão FIEP): API em NestJS + Prisma (apps/api) com o MESMO contrato HTTP. Roda lint, Jest e
  # as MESMAS suítes de caixa-preta usadas no servidor .NET, com SQL Server 2022 e PostgreSQL 16 reais.
  # -------------------------------------------------------------------------------------------------
  api-nestjs:
    name: API NestJS + Prisma — SQL Server 2022 (mesmas suítes do servidor .NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      HUSKY: "0"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MesLion#Teste2026"
          MSSQL_PID: Developer
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'MesLion#Teste2026' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste (Python, Chromium, psql)
        run: |
          pip install requests pymssql playwright bcrypt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq postgresql-client >/dev/null
          node --version && npm --version && pwsh --version

      - name: Instalar dependências (npm ci) e gerar o cliente Prisma
        run: |
          mkdir -p out/api
          npm ci 2>&1 | tail -5
          npm run prisma:generate --workspace apps/api 2>&1 | tee out/api/prisma_generate.log

      - name: Lint (ESLint) e formatação (Prettier)
        run: |
          npm run lint 2>&1 | tee out/api/lint.log
          npm run typecheck 2>&1 | tee -a out/api/lint.log
          npm run format:check 2>&1 | tee -a out/api/lint.log

      - name: Infraestrutura — infra/main.bicep compila (servidor .NET ou API NestJS)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null && echo "Bicep OK"

      - name: Testes Jest — unidade (com cobertura)
        run: npm run test:cov --workspace apps/api -- --ci 2>&1 | tee out/api/jest_unidade.log

      - name: Testes Jest — e2e (supertest, modo Portátil)
        run: npm run test:e2e --workspace apps/api -- --ci 2>&1 | tee out/api/jest_e2e.log

      - name: Compilar e montar o pacote (Azure App Service Linux / Node 22)
        run: |
          npm run build --workspace apps/api 2>&1 | tail -5
          npm run pacote --workspace apps/api -- "$PWD/out/api/app" 2>&1 | tee out/api/pacote.log
          (cd out/api/app && zip -qr ../MES_LION_API_NESTJS_app.zip .)
          ls -la out/api/MES_LION_API_NESTJS_app.zip

      - name: Iniciar API com SQL Server
        run: |
          mkdir -p out/api/Dados
          cp tests/dados_teste/MES_LION_DATA_TESTE.json out/api/Dados/MES_LION_DATA.json
          cd out/api/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionApiCI;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Relacional__AtrasoSegundos=2
          nohup ./MesLion.Server --urls http://0.0.0.0:8765 > ../server_sql.log 2>&1 &   # 0.0.0.0: também testa o acesso remoto (rede)
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 1; done
          echo; curl -sf http://127.0.0.1:8765/healthz | tee ../healthz_sql.json || { tail -n 200 ../server_sql.log; exit 1; }

      - name: Testes de API (SQL Server)
        run: python tests/testes_api.py http://127.0.0.1:8765 out/api/Dados/MES_LION_DATA.json 2>&1 | tee out/api/testes_api_sql.log

      - name: Verificação do banco SQL Server (esquema, camada relacional, views, FKs, sessões JWT)
        run: python tests/verificar_sqlserver.py localhost 1433 sa "$SA_PASSWORD" MesLionApiCI http://127.0.0.1:8765 2>&1 | tee out/api/verificar_sqlserver.log

      - name: Prisma — schema.prisma corresponde ao banco criado pelos scripts T-SQL
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=MesLionApiCI;user=sa;password={MesLion#Teste2026};encrypt=true;trustServerCertificate=true"
        run: |
          npx prisma db pull --print > ../../out/api/prisma_db_pull.prisma 2> ../../out/api/prisma_db_pull.err || true
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > ../../out/api/prisma_diff.sql 2>&1 || true
          node scripts/conferir-esquema-prisma.mjs ../../out/api/prisma_diff.sql 2>&1 | tee ../../out/api/prisma_esquema.log

      - name: Testes ponta a ponta no navegador (SQL Server)
        run: |
          IP=$(hostname -I | awk '{print $1}')
          echo "Acesso remoto (rede) via http://$IP:8765"
          python tests/e2e_fluxos.py http://127.0.0.1:8765 "http://$IP:8765" 2>&1 | tee out/api/e2e_sql.log

      - name: A/B de telas — servidor original (contrato PowerShell) x API NestJS (SQL Server)
        run: |
          mkdir -p out/frontend_original
          cp -r src/MesLion.Server/wwwroot/* out/frontend_original/
          cp tests/referencia_frontend_original/index.html out/frontend_original/index.html
          rm out/frontend_original/js/mes_plataforma_azure.js   # adaptador de plataforma (inclui a correção de ACV/LCC)
          nohup python tests/servidor_referencia_contrato_ps.py --root out/frontend_original --seed out/api/Dados/MES_LION_DATA.json --port 8766 > out/api/ref.log 2>&1 &
          python tests/seed_com_colecoes.py out/api/Dados/MES_LION_DATA.json out/api/seed_com_colecoes.json
          nohup python tests/servidor_referencia_contrato_ps.py --root out/frontend_original --seed out/api/seed_com_colecoes.json --port 8768 > out/api/ref_colecoes.log 2>&1 &
          cd out/api/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionApiAB;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Arquivos__PastaLocal=../DadosAB/Arquivos
          nohup ./MesLion.Server --urls http://127.0.0.1:8767 > ../server_ab.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8767/healthz && curl -s http://127.0.0.1:8766/ > /dev/null && curl -s http://127.0.0.1:8768/ > /dev/null && break; sleep 1; done
          cd ../../..
          python tests/ab_comparar_telas.py http://127.0.0.1:8766 http://127.0.0.1:8767 out/api/ab_resultado.json http://127.0.0.1:8768 2>&1 | tee out/api/ab_telas.log

      - name: Primeira tela após o login — todas as opções do menu, sem erro JavaScript (SQL Server)
        run: |
          cd out/api/app
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionApiPT;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Banco__Provedor=SqlServer
          export MesLion__Arquivos__PastaLocal=../DadosPT/Arquivos
          nohup ./MesLion.Server --urls http://127.0.0.1:8769 > ../server_pt.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8769/healthz && break; sleep 1; done
          cd ../../..
          python tests/primeira_tela.py http://127.0.0.1:8769 2>&1 | tee out/api/primeira_tela.log

      - name: Migração PostgreSQL → SQL Server (script de exportação + importação pela API)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python tests/teste_migracao.py out/api/app tests/dados_teste/MES_LION_DATA_TESTE.json "Server=localhost,1433;Database=MesLionApiMig;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true" 2>&1 | tee out/api/migracao.log

      - name: Importação de pacote de migração no modo Portátil
        run: python tests/teste_importacao_pacote.py out/api/app tests/dados_teste/MES_LION_DATA_TESTE.json 2>&1 | tee out/api/importacao_portatil.log

      - name: Arquivos no Azure Blob Storage (emulador Azurite) — documentos, anexos, passaportes e backups
        run: |
          mkdir -p out/api/azurite
          nohup npx --yes -p azurite@3.37.0 azurite-blob --silent --location out/api/azurite --blobHost 127.0.0.1 --blobPort 10000 --skipApiVersionCheck > out/api/azurite.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1 && break; sleep 1; done
          mkdir -p out/api/DadosBlob
          cp tests/dados_teste/MES_LION_DATA_TESTE.json out/api/DadosBlob/MES_LION_DATA.json
          cd out/api/app
          export MesLion__Banco__Provedor=SqlServer
          export ConnectionStrings__MesLion="Server=localhost,1433;Database=MesLionApiBlob;User ID=sa;Password=$SA_PASSWORD;Encrypt=true;TrustServerCertificate=true"
          export MesLion__Seed__ArquivoInicial=../DadosBlob/MES_LION_DATA.json
          export MesLion__Arquivos__Provedor=AzureBlob
          export MesLion__Arquivos__AzureBlob__ConnectionString="UseDevelopmentStorage=true"
          export MesLion__Arquivos__AzureBlob__Container=meslion-ci
          nohup ./MesLion.Server --urls http://127.0.0.1:8771 > ../server_blob.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8771/healthz && break; sleep 1; done
          cd ../../..
          grep -m1 "Arquivos: Azure Blob" out/api/server_blob.log
          python tests/testes_api.py http://127.0.0.1:8771 out/api/DadosBlob/MES_LION_DATA.json 2>&1 | tee out/api/testes_api_blob.log

      - name: Logs do servidor
        if: always()
        run: |
          tail -n 80 out/api/server_sql.log || true
          tail -n 40 out/api/server_ab.log || true

      - name: Diagnóstico — publicar logs no release "ci-diagnostico"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diag
          cp out/api/*.log out/api/*.json out/api/*.sql out/api/*.prisma out/api/*.err diag/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > diag/execucao.txt
          (cd diag && zip -qr ../diagnostico-api.zip .)
          gh release create ci-diagnostico --repo "$GITHUB_REPOSITORY" --title "Diagnóstico do CI" --notes "Logs da última execução do CI (não é um pacote para uso)." --prerelease --target "$GITHUB_SHA" 2>/dev/null || true
          for t in 1 2 3; do gh release upload ci-diagnostico diagnostico-api.zip --repo "$GITHUB_REPOSITORY" --clobber && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-api
          path: |
            out/api/*.log
            out/api/ab_resultado.json
            out/api/MES_LION_API_NESTJS_app.zip

  publicar:
    name: Publicar release "build-mais-recente"
    needs: [ linux, windows, api-nestjs ]
    # Os pacotes do servidor .NET são publicados mesmo enquanto a API NestJS (fase 1) estiver em validação.
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          API_OK: ${{ needs.api-nestjs.result == 'success' }}
        run: |
          ls -R artefatos | head -50
          extras=()
          if [ "$API_OK" = "true" ] && [ -f artefatos/resultados-api/MES_LION_API_NESTJS_app.zip ]; then
            extras+=(artefatos/resultados-api/MES_LION_API_NESTJS_app.zip)
          fi
          gh release delete build-mais-recente --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create build-mais-recente --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Build mais recente ($GITHUB_SHA)" --notes "Pacotes gerados e testados automaticamente pelo CI." --prerelease \
            artefatos/resultados-windows/MES_LION_AZURE_win-x64_app.zip \
            artefatos/resultados-linux/MES_LION_AZURE_app-service.zip \
            artefatos/resultados-linux/ab_resultado.json "${extras[@]}"
