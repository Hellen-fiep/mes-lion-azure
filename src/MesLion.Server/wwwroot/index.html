<script>
window.addEventListener('error', function(e){
  if(e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
  try{
    var b = document.getElementById('fatalErrorBanner');
    if(!b) return;
    b.style.display = 'block';
    var stack = (e.error && e.error.stack) ? e.error.stack : '';
    b.textContent = 'ERRO NO MES LION — copie esta mensagem e envie: \n' + (e.message || (e.error && e.error.message) || (e.target && e.target.tagName==='SCRIPT' ? 'Falha ao carregar script: '+e.target.src : 'Falha ao carregar recurso: '+(e.target && (e.target.src||e.target.href)||'desconhecido'))) + '\nArquivo: ' + (e.filename || (e.target && (e.target.src||e.target.href)) || '?') + ' | Linha: ' + (e.lineno||'?') + ' Coluna: ' + (e.colno||'?') + (stack ? ('\n'+stack.split('\n').slice(0,5).join('\n')) : '');
  }catch(err){}
}, true);
window.addEventListener('unhandledrejection', function(e){
  try{
    var b = document.getElementById('fatalErrorBanner');
    if(!b) return;
    b.style.display = 'block';
    b.textContent = 'ERRO (promise) NO MES LION — copie e envie: \n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  }catch(err){}
});
</script>
